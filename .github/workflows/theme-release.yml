name: Build and release theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theme-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme assets
        run: npm run build

      - name: Create theme zip
        run: npm run zip

      - name: Copy release asset into workspace
        run: mkdir -p dist && cp ../dist/studentspex.zip dist/studentspex.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main
          name: Studentspex Theme (main)
          generate_release_notes: true
          files: |
            dist/studentspex.zip
          fail_on_unmatched_files: true
